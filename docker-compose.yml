services:
  zai2api:
    build:
      context: .
      dockerfile: Dockerfile
    image: zai2api:latest
    container_name: zai2api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - HEADLESS=true
      - DEFAULT_MODEL=glm-5.3-flash
      # RAM Optimization Flags:
      - OPTIMIZE_RAM=true
      - BLOCK_IMAGES=true
      - MALLOC_ARENA_MAX=2
      - NODE_OPTIONS=--max-old-space-size=384
      # Add your token here or configure it in the web UI:
      # - ZAI_AUTH_TOKEN=your_token_here
    volumes:
      # Persist stealth browser cache, profiles, and authenticated session
      - ./user-data-camoufox:/app/user-data-camoufox
      # Persist tokens configured via web UI
      - ./tokens.json:/app/tokens.json
    # Increase shared memory size to avoid browser tab crashes
    shm_size: "2gb"
